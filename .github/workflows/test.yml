name: 测试

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 全量回归
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 测试里的「今天」是按本地时间算的（test-store 的 today、
    # shots 的日期回推）。runner 默认 UTC，和写测试时的时区不一致，
    # 容易在跨零点那几个小时假红。钉死成项目所在地的时区。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      # test-browser.js 用 CDP over WebSocket，靠的是 Node 22 的全局 WebSocket。
      # Node 20 没有（要加 flag），必须 22+。
      - name: 装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ★ 这一步不是走过场。
      # test-browser.js 找不到 Chromium 内核时会打印「跳过」然后以 **0 项** 退出，
      # 而 run-all.js 把「0 项、0 失败」算作通过 ——
      # 也就是说「根本没测」和「全部通过」在汇总里长得一模一样。
      # runner 上是自带 Chrome 的，先确认它在，否则这次 CI 的绿是假的。
      #
      # 候选列表要和 tests/test-browser.js 的 findBrowser() 保持一致
      # （workflow 没法 import 测试脚本，只能手动同步这两处）。
      - name: 确认浏览器存在（防止冒烟测试静默跳过）
        run: |
          node -e '
            const fs = require("fs");
            const cands = [
              "/usr/bin/google-chrome", "/usr/bin/google-chrome-stable",
              "/usr/bin/chromium", "/usr/bin/chromium-browser",
              "/opt/google/chrome/chrome", "/opt/google/chrome/google-chrome",
              "/snap/bin/chromium"
            ];
            const hit = cands.find(function (p) { return fs.existsSync(p); });
            if (!hit) {
              console.error("::error::runner 上找不到浏览器，浏览器冒烟测试会静默跳过 —— 这次通过不算数");
              process.exit(1);
            }
            console.log("找到浏览器：" + hit);
          '

      - name: 跑全量回归
        run: node tests/run-all.js
